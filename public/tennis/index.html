<title>テニス部 練習メニュー組み立て</title>
<style>
  :root{
    --court:#2f6b4f;
    --court-line:#f7f4ec;
    --clay:#c1652f;
    --clay-dark:#9c4d21;
    --ink:#22301f;
    --paper:#f7f4ec;
    --paper-dim:#ece6d6;
    --card:#ffffff;
    --muted:#7c8577;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-bottom:60px;
  }
  header{
    background:var(--court);
    color:var(--court-line);
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:14px;
    height:2px;
    background:repeating-linear-gradient(90deg,var(--court-line) 0 24px, transparent 24px 34px);
    opacity:.55;
  }
  header h1{
    margin:0 0 4px;
    font-size:22px;
    letter-spacing:.03em;
  }
  header p{
    margin:0;
    font-size:13px;
    opacity:.85;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:20px 16px;
  }
  .panel{
    background:var(--card);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .panel h2{
    font-size:15px;
    margin:0 0 12px;
    color:var(--clay-dark);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2::before{
    content:"";
    width:8px;height:8px;
    border-radius:50%;
    background:var(--clay);
    display:inline-block;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
  }
  .chip{
    background:var(--paper-dim);
    border-radius:20px;
    padding:6px 10px 6px 14px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .chip button{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    padding:2px;
  }
  .chip button:hover{color:var(--clay);}
  .add-row{
    display:flex;
    gap:8px;
  }
  .add-row input{
    flex:1;
    padding:8px 10px;
    border:1px solid #dcd6c4;
    border-radius:6px;
    font-size:13px;
    font-family:inherit;
  }
  .add-row button{
    background:var(--clay);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:8px 16px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-row button:hover{background:var(--clay-dark);}

  .day-tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .day-tab{
    padding:8px 16px;
    border-radius:8px;
    background:var(--paper-dim);
    font-size:13px;
    cursor:pointer;
    border:2px solid transparent;
    font-weight:600;
    color:var(--ink);
  }
  .day-tab.active{
    background:var(--court);
    color:var(--court-line);
  }

  .day-block{display:none;}
  .day-block.active{display:block;}

  .session-card{
    background:var(--card);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    border-left:4px solid var(--court);
  }
  .session-card h3{
    margin:0 0 12px;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .session-card h3 .badge{
    background:var(--paper-dim);
    padding:3px 10px;
    border-radius:20px;
    font-size:12px;
    color:var(--muted);
    font-weight:normal;
  }

  .theme-banner{
    display:inline-block;
    background:var(--clay);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:5px 12px;
    border-radius:6px;
    margin-bottom:12px;
  }
  .court-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:10px;
  }
  .court-cell{
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    display:flex;
    flex-direction:column;
  }
  .court-cell.g-cell{
    background:var(--paper-dim);
  }
  .court-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .court-label{

    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
    flex-shrink:0;

  .g-cell .court-label{

    min-width:0;

    border-radius:6px;

    border-radius:6px;
    padding:5px 8px;
    font-size:12px;
  }

    font-size:13px;
    padding:0 2px;

    display:flex;
    gap:6px;

  .menu-add-row select{
    flex:1;
    min-width:0;
    font-size:12px;
    padding:5px 6px;
    border:1px solid #dcd6c4;
    border-radius:6px;
    font-family:inherit;
    background:#fff;
  }
  .menu-add-row button{
    background:var(--court);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:5px 12px;
    font-size:12px;
    cursor:pointer;

  .g-note{

function sessionId(day, idx){ return day + '-' + idx; }

function ensureSession(id){
  if(!data.sessions[id]){
    data.sessions[id] = { courts:{}, g:{coach:'', note:''} };
  }
  const s = data.sessions[id];
  if(!s.courts) s.courts = {};
  COURTS.forEach(c=>{
    if(!s.courts[c] || typeof s.courts[c] !== 'object'){
      s.courts[c] = {coach:'', menus:[]};
    }
    if(!Array.isArray(s.courts[c].menus)) s.courts[c].menus = [];
  });
  if(!s.g) s.g = {coach:'', note:''};
  return s;
}

async function loadData(){
  try{
    const snap = await tennisRef.get();
    if(snap.exists){
      const parsed = snap.data() || {};
      data.menus = parsed.menus && parsed.menus.length ? parsed.menus : data.menus;
      data.coaches = parsed.coaches && parsed.coaches.length ? parsed.coaches : data.coaches;
      data.sessions = parsed.sessions ? JSON.parse(parsed.sessions) : data.sessions;
    }
  }catch(e){
    console.log('no existing data yet, using defaults', e);
  }
  render();
}

let saveTimer = null;
async function saveData(){
  try{
    await tennisRef.set({
      menus: data.menus,
      coaches: data.coaches,
      sessions: JSON.stringify(data.sessions)
    });
    flagSaved();
  }catch(e){
    console.error('save failed', e);
  }
}
function saveDataDebounced(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 300);
}
function flagSaved(){
  const el = document.getElementById('saveFlag');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 900);
}

function addMenu(){
  const input = document.getElementById('menuInput');
  const val = input.value.trim();
  if(!val) return;
  if(data.menus.includes(val)){ input.value=''; return; }
  data.menus.push(val);
  input.value='';
  render();
  saveDataDebounced();
}
function removeMenu(name){
  data.menus = data.menus.filter(m=>m!==name);
  Object.values(data.sessions).forEach(s=>{
    if(!s.courts) return;
    Object.keys(s.courts).forEach(c=>{
      if(Array.isArray(s.courts[c].menus)){
        s.courts[c].menus = s.courts[c].menus.filter(m=>m!==name);
      }
    });
  });
  render();
  saveDataDebounced();
}
function addCoach(){
  const input = document.getElementById('coachInput');
  const val = input.value.trim();
  if(!val) return;
  if(data.coaches.includes(val)){ input.value=''; return; }
  data.coaches.push(val);
  input.value='';
  render();
  saveDataDebounced();
}
function removeCoach(name){
  data.coaches = data.coaches.filter(c=>c!==name);
  Object.values(data.sessions).forEach(s=>{
    if(s.courts){
      Object.keys(s.courts).forEach(c=>{
        if(s.courts[c].coach===name) s.courts[c].coach='';
      });
    }
    if(s.g && s.g.coach===name) s.g.coach='';
  });
  render();
  saveDataDebounced();
}

function setCourtCoach(id, court, val){
  ensureSession(id).courts[court].coach = val;
  saveDataDebounced();
}
function addCourtMenu(id, court, val){
  if(!val) return;
  ensureSession(id).courts[court].menus.push(val);
  render();
  saveDataDebounced();
}
function removeCourtMenu(id, court, idx){
  ensureSession(id).courts[court].menus.splice(idx,1);
  render();
  saveDataDebounced();
}
function setGCoach(id, val){
  ensureSession(id).g.coach = val;
  saveDataDebounced();
}
function setGNote(id, val){
  ensureSession(id).g.note = val;
  saveDataDebounced();
}

let activeDay = DAYS[0].key;
function switchDay(key){
  activeDay = key;
  render();
}

function render(){
  const menuChips = document.getElementById('menuChips');
  menuChips.innerHTML = data.menus.length
    ? data.menus.map(m=>`<span class="chip">${escapeHtml(m)}<button onclick="removeMenu('${escapeAttr(m)}')">×</button></span>`).join('')
    : '<span class="empty-note">まだメニューがありません</span>';

  const coachChips = document.getElementById('coachChips');
  coachChips.innerHTML = data.coaches.length
    ? data.coaches.map(c=>`<span class="chip">${escapeHtml(c)}<button onclick="removeCoach('${escapeAttr(c)}')">×</button></span>`).join('')
    : '<span class="empty-note">まだコーチがいません</span>';

  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = DAYS.map(d=>
    `<div class="day-tab ${d.key===activeDay?'active':''}" onclick="switchDay('${d.key}')">${d.label}</div>`
  ).join('');

  const blocks = document.getElementById('dayBlocks');
  blocks.innerHTML = DAYS.map(d=>{
    let sessionsHtml = '';
    for(let i=1;i<=d.sessions.length;i++){
      const timeLabel = d.sessions[i-1];
      const id = sessionId(d.key, i);
      const s = ensureSession(id);

      const coachOptionsFor = (selected)=>['<option value="">未定</option>']
        .concat(data.coaches.map(c=>`<option value="${escapeAttr(c)}" ${selected===c?'selected':''}>${escapeHtml(c)}</option>`))
        .join('');

      const menuOptionsPlain = data.menus.map(m=>`<option value="${escapeAttr(m)}">${escapeHtml(m)}</option>`).join('');

      const courtCells = COURTS.map(court=>{
        const cd = s.courts[court];
        const listHtml = cd.menus.length
          ? cd.menus.map((m,idx)=>`<div class="menu-item"><span>${idx+1}. ${escapeHtml(m)}</span><button onclick="removeCourtMenu('${id}','${court}',${idx})">×</button></div>`).join('')
          : '<div class="hint">メニュー未設定</div>';
        const addSelectId = `add-${id}-${court}`;
        return `
          <div class="court-cell">
            <div class="court-head">
              <div class="court-label">${court}</div>
              <select class="coach-select" onchange="setCourtCoach('${id}','${court}', this.value)">${coachOptionsFor(cd.coach)}</select>
            </div>
            <div class="menu-list">${listHtml}</div>
            <div class="menu-add-row">
              <select id="${addSelectId}">${menuOptionsPlain || '<option value="">メニューなし</option>'}</select>
              <button onclick="addCourtMenu('${id}','${court}', document.getElementById('${addSelectId}').value)">＋追加</button>
            </div>
          </div>`;
      }).join('');

      const gCell = `
        <div class="court-cell g-cell">
          <div class="court-head">
            <div class="court-label">G</div>
            <select class="coach-select" onchange="setGCoach('${id}', this.value)">${coachOptionsFor(s.g.coach)}</select>
          </div>
          <div class="hint">Gコートはメニュー設定なし</div>
          <input class="g-note" type="text" placeholder="メモ（任意）" value="${escapeAttr(s.g.note||'')}" onchange="setGNote('${id}', this.value)">
        </div>`;

      const theme = THEMES[id];
      const themeBanner = theme ? `<div class="theme-banner">テーマ：${escapeHtml(theme)}</div>` : '';

      sessionsHtml += `
        <div class="session-card">
          <h3>${escapeHtml(timeLabel)}</h3>
          ${themeBanner}
          <div class="court-grid">
            ${courtCells}
            ${gCell}
          </div>
        </div>`;
    }
    return `<div class="day-block ${d.key===activeDay?'active':''}">${sessionsHtml}</div>`;
  }).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){
  return String(str).replace(/'/g, "\\'");
}

// 画面が真っ白にならないよう、まず手元のデータで即座に描画し、
// その後クラウドの共有データが取得できたら改めて描画し直す
window.addEventListener('error', function(e){
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px;font-size:12px;z-index:9999;';
  box.textContent = '表示エラーが発生しました: ' + (e.message || e);
  document.body.prepend(box);
});

render();
loadData();
</script>
