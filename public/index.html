<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>整理券</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d3a63">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Outfit:wght@600;700;800;900&family=Dela+Gothic+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0612; --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.08);
      --border:rgba(255,255,255,.1); --accent:#a8d4ff; --accent2:#5b8def;
      --accent3:#7ef2c0; --warning:#fdcb6e; --danger:#9498c4;
      --text:#f4eefc; --muted:#8b7fa8; --glow:91,141,239;
      --font-head:'Dela Gothic One','Zen Kaku Gothic New','Noto Sans JP',-apple-system,sans-serif;
      --font-num:'Outfit','Noto Sans JP',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:'Noto Sans JP',-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;transition:background .4s}
    .bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(ellipse 70% 90% at 15% 40%,rgba(var(--glow),.22) 0%,transparent 60%),
                radial-gradient(ellipse 55% 65% at 88% 18%,rgba(168,212,255,.14) 0%,transparent 60%),
                radial-gradient(ellipse 45% 55% at 50% 88%,rgba(240,147,43,.07) 0%,transparent 60%);
      animation:bgBreath 6s ease-in-out infinite alternate}
    @keyframes bgBreath{from{opacity:.75}to{opacity:1}}
    #root{position:relative;z-index:1;min-height:100dvh}

    /* Layout */
    .page{max-width:440px;margin:0 auto;padding:16px 18px 52px}
    .header{text-align:center;padding:40px 0 26px}
    .badge{display:inline-block;font-family:var(--font-num);font-size:10px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--accent);border:1px solid rgba(var(--glow),.3);border-radius:100px;padding:4px 14px;margin-bottom:12px}
    .header h1{font-family:var(--font-head);font-size:24px;font-weight:400;letter-spacing:.5px;line-height:1.3;background:linear-gradient(120deg,#fff 20%,var(--accent2) 65%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(var(--glow),.35))}
    .store-sub{color:var(--muted);font-size:13px;margin-top:4px;font-family:'Noto Sans JP',-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;font-style:normal}
    .store-loc{color:var(--accent2);font-size:12px;margin-top:3px}

    /* Cards */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:14px;backdrop-filter:blur(12px)}
    .card.highlight{background:rgba(var(--glow),.1);border-color:rgba(var(--glow),.35)}
    .card.success{background:rgba(85,239,196,.07);border-color:rgba(85,239,196,.25)}
    .card.warn{background:rgba(253,203,110,.07);border-color:rgba(253,203,110,.2)}

    /* Ticket */
    .ticket-box{text-align:center;padding:24px 16px 18px}
    .ticket-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .ticket-num{font-family:var(--font-num);font-size:90px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .ticket-num.dim{background:none;-webkit-text-fill-color:var(--muted)}
    .ticket-num.calling{animation:glowPulse 1.4s ease-in-out infinite}
    @keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 24px rgba(var(--glow),.5))}50%{filter:drop-shadow(0 0 52px rgba(var(--glow),.9))}}

    /* Status */
    .status{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:100px;font-size:13px;font-weight:700;margin-top:12px}
    .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
    .status.waiting{background:rgba(253,203,110,.12);color:var(--warning);border:1px solid rgba(253,203,110,.25)}
    .status.called{background:rgba(var(--glow),.18);color:var(--accent2);border:1px solid rgba(var(--glow),.3)}
    .status.done{background:rgba(85,239,196,.1);color:var(--accent3);border:1px solid rgba(85,239,196,.22)}
    .status.waiting .dot,.status.called .dot{animation:blink 1.1s ease infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

    /* Called overlay */
    .called-overlay{position:fixed;inset:0;z-index:99;pointer-events:none;background:rgba(var(--glow),.1);animation:overlayPulse 1.4s ease infinite}
    @keyframes overlayPulse{0%,100%{opacity:0}50%{opacity:1}}

    /* Info rows */
    .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
    .row:last-child{border-bottom:none}
    .row-label{font-size:13px;color:var(--muted)}
    .row-value{font-size:15px;font-weight:700}

    /* Buttons */
    .btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .16s ease;letter-spacing:.4px}
    .btn+.btn{margin-top:10px}
    .btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
    .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 24px rgba(var(--glow),.45)}
    .btn-primary:not(:disabled):active{transform:scale(.97)}
    .btn-rainbow{background:linear-gradient(120deg,#a855f7 0%,#ec4899 55%,#fb7185 100%);color:#fff;box-shadow:0 4px 26px rgba(236,72,153,.35)}
    .btn-rainbow:not(:disabled):active{transform:scale(.97)}
    .btn-success{background:linear-gradient(135deg,#55efc4,#00b894);color:#0a2d22;box-shadow:0 4px 20px rgba(85,239,196,.25)}
    .btn-success:not(:disabled):active{transform:scale(.97)}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:not(:disabled):active{transform:scale(.97)}
    .btn-icon{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;padding:6px 10px;font-size:16px}

    /* Staff call count control */
    .ctrl-row{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 0}
    .ctrl-btn{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
    .ctrl-btn:not(:disabled):active{transform:scale(.92);background:rgba(var(--glow),.2)}
    .ctrl-btn:disabled{opacity:.3;cursor:not-allowed}
    .ctrl-num{font-size:48px;font-weight:900;line-height:1;min-width:80px;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .ctrl-unit{font-size:14px;font-weight:400;color:var(--muted);margin-top:6px}

    /* Stats row */
    .stats-row{display:flex;gap:10px;margin-bottom:14px}
    .stat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center}
    .stat-num{font-size:26px;font-weight:900}
    .stat-label{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:1px}

    /* Queue list */
    .queue-scroll{max-height:220px;overflow-y:auto}
    .q-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
    .q-item.active{background:rgba(var(--glow),.12);border-color:rgba(var(--glow),.3)}
    .q-num{font-family:var(--font-num);font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
    .q-pill{font-size:10px;font-weight:800;padding:3px 10px;border-radius:100px;letter-spacing:1px}
    .q-pill.waiting{background:rgba(253,203,110,.13);color:var(--warning)}
    .q-pill.called{background:rgba(var(--glow),.15);color:var(--accent2)}

    /* Form fields */
    .field{margin-bottom:14px}
    .field:last-child{margin-bottom:0}
    .field-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;letter-spacing:.5px}
    .field-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none}
    .field-input:focus{border-color:var(--accent)}
    select.field-input option{background:#1a1a2e;color:var(--text)}

    /* Theme grid */
    .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .theme-swatch{cursor:pointer;text-align:center}
    .theme-preview{height:48px;border-radius:10px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:4px;transition:border-color .15s}
    .theme-swatch.selected .theme-preview{border-width:3px!important}
    .theme-dot{width:8px;height:8px;border-radius:50%}
    .theme-name{font-size:10px;color:var(--muted)}

    /* Stamp */
    .stamp-header{margin-bottom:10px}
    .stamp-title{font-size:14px;font-weight:700}
    .stamp-sub{font-size:11px;color:var(--muted);margin-top:3px}

    /* Display board */
    .display-root{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative}
    .display-top{position:absolute;top:24px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:4px;color:var(--muted)}
    .display-slogan{font-size:13px;color:var(--muted);margin-top:-2px;margin-bottom:16px}
    .display-label{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--muted)}
    .display-range{font-size:clamp(56px,16vw,110px);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glowPulse 2s ease infinite}
    .display-range.empty{background:none;-webkit-text-fill-color:var(--muted);animation:none}
    .display-caption{font-size:16px;color:var(--muted);margin-top:16px}
    .display-wait-label{font-size:12px;letter-spacing:3px;color:var(--muted);margin-top:44px}
    .display-wait-num{font-size:64px;font-weight:900;color:var(--accent3);line-height:1}
    .display-wait-unit{font-size:14px;color:var(--muted)}

    /* Open pill */
    .open-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:12px;font-weight:700}
    .open-pill.open{background:rgba(85,239,196,.1);color:var(--accent3)}
    .open-pill.closed{background:rgba(148,158,196,.1);color:var(--danger)}

    /* Section title */
    .sec{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}

    /* BV logo tap area */
    .bv-logo{font-family:var(--font-num);font-size:11px;font-weight:600;letter-spacing:3px;color:rgba(255,255,255,.15);cursor:pointer;user-select:none;padding:8px}

    /* Toast */
    .toast{position:fixed;bottom:26px;left:50%;z-index:9999;transform:translateX(-50%) translateY(80px);background:rgba(16,16,28,.96);border:1px solid rgba(var(--glow),.25);color:var(--text);padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .26s ease;backdrop-filter:blur(20px);white-space:nowrap;pointer-events:none}
    .toast.show{transform:translateX(-50%) translateY(0)}

    /* Loader */
    .loader{display:flex;align-items:center;justify-content:center;padding:120px}
    .spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(var(--glow),.2);border-top-color:var(--accent);animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .sp{height:10px}
    .link{color:var(--muted);font-size:12px;text-decoration:none}
    .link:hover{color:var(--accent)}
    .center{text-align:center}
    .empty-msg{color:var(--muted);text-align:center;padding:20px;font-size:13px}
    .hdr-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}

    /* ── Ticket Card ───────────────────────────────── */
    .ticket-card{border-radius:22px;overflow:hidden;margin-bottom:16px;position:relative;box-shadow:0 12px 50px rgba(0,0,0,.55)}
    .ticket-card.called{animation:ticketGlow 1.6s ease-in-out infinite}
    @keyframes ticketGlow{0%,100%{box-shadow:0 0 0 2px rgba(var(--glow),.4),0 12px 40px rgba(var(--glow),.2)}50%{box-shadow:0 0 0 3px rgba(var(--glow),.9),0 16px 60px rgba(var(--glow),.5)}}
    .tc-top{padding:24px 22px 18px;position:relative;overflow:hidden;background:linear-gradient(150deg,rgba(var(--glow),.3) 0%,rgba(0,0,0,.7) 100%)}
    .tc-top::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 120% at 20% 50%,rgba(var(--glow),.22),transparent 70%);pointer-events:none}
    .tc-brand{font-size:9px;letter-spacing:5px;color:rgba(255,255,255,.35);margin-bottom:8px;position:relative}
    .tc-number-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.38);position:relative}
    .tc-number{font-family:var(--font-num);font-size:66px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff 20%,rgba(255,255,255,.55));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:2px 0 10px;position:relative}
    .tc-status-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:100px;font-size:12px;font-weight:700;background:rgba(0,0,0,.35);position:relative}
    /* Perforated divider */
    .tc-perf{height:1px;position:relative;overflow:visible;background:repeating-linear-gradient(to right,transparent,transparent 5px,rgba(200,200,200,.25) 5px,rgba(200,200,200,.25) 10px)}
    .tc-perf::before,.tc-perf::after{content:'';position:absolute;width:26px;height:26px;background:var(--bg);border-radius:50%;top:-13px;transition:background .4s}
    .tc-perf::before{left:-13px}.tc-perf::after{right:-13px}
    /* Ticket bottom – light for readability */
    .tc-bottom{background:rgba(255,255,255,.93);padding:16px 20px 18px;display:flex;align-items:flex-start;gap:14px}
    .tc-info{flex:1;min-width:0}
    .tc-info-row{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.07)}
    .tc-info-row:last-child{border-bottom:none}
    .tc-info-key{font-size:10px;color:#888;letter-spacing:.3px;min-width:40px;flex-shrink:0}
    .tc-info-val{font-size:14px;font-weight:700;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tc-info-val.highlight{color:#c05010;font-weight:900}
    .tc-info-val.muted{color:#888;font-weight:500;font-size:13px}
    .tc-stamp-area{flex-shrink:0;width:94px;display:flex;align-items:center;justify-content:center;margin-top:2px}
    .stamp-svg{width:94px;height:94px;display:block}
    .stamp-svg.used{filter:drop-shadow(0 2px 8px rgba(200,80,20,.4))}
    /* Expire bar */
    .expire-bar{display:flex;align-items:center;justify-content:space-between;background:rgba(253,203,110,.08);border:1px solid rgba(253,203,110,.2);border-radius:10px;padding:9px 14px;margin-bottom:10px}
    .expire-bar-label{font-size:12px;color:var(--muted)}
    .expire-countdown{font-family:var(--font-num);font-size:16px;font-weight:900;color:var(--warning);font-variant-numeric:tabular-nums;letter-spacing:.5px}
    /* Modal (bottom sheet) */
    .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}
    .modal-card{width:100%;max-width:440px;background:#14141f;border:1px solid rgba(var(--glow),.2);border-radius:24px 24px 0 0;padding:28px 22px 44px;animation:slideUp .22s ease}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-title{font-size:19px;font-weight:800;margin-bottom:6px}
    .modal-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.65}
    /* Slot picker */
    .slot-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
    .slot-item{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
    .slot-item:not(.full):active{background:rgba(var(--glow),.15)}
    .slot-item.full{opacity:.38;cursor:not-allowed}
    .slot-item.selected{border-color:var(--accent);background:rgba(var(--glow),.13);box-shadow:0 0 0 1px var(--accent)}
    .slot-item-left{}
    .slot-item-time{font-size:20px;font-weight:900;letter-spacing:.3px}
    .slot-item-date{font-size:11px;color:var(--muted);margin-top:2px}
    .slot-avail{font-size:12px;font-weight:700;color:var(--accent3)}
    .slot-avail.low{color:var(--warning)}
    .slot-avail.full{color:var(--muted)}
    /* Reservation card */
    .resv-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .resv-info{flex:1;min-width:0}
    .resv-name{font-size:15px;font-weight:700}
    .resv-meta{font-size:11px;color:var(--muted);margin-top:2px}
    .resv-slot-label{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin:12px 0 6px}
    /* Two-column action buttons */
    .btn-row{display:flex;gap:10px}
    .btn-row .btn{flex:1}
    /* Staff ticket list */
    .stk-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:6px}
    .stk-num{font-family:var(--font-num);font-size:17px;font-weight:900;min-width:46px;font-variant-numeric:tabular-nums;color:var(--text)}
    .stk-info{flex:1;min-width:0}
    .stk-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .stk-meta{font-size:11px;color:var(--muted);margin-top:1px}
    .stk-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;white-space:nowrap;flex-shrink:0}
    .stk-badge.waiting{background:rgba(253,203,110,.13);color:var(--warning)}
    .stk-badge.called{background:rgba(var(--glow),.15);color:var(--accent2)}
    .stk-badge.done{background:rgba(85,239,196,.1);color:var(--accent3)}
    .stk-badge.cancelled{background:rgba(255,255,255,.05);color:var(--muted)}
    .stk-badge.expired{background:rgba(148,158,196,.15);color:var(--danger)}
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div id="root"><div class="loader"><div class="spin"></div></div></div>
  <div class="toast" id="toast"></div>
  <div id="generic-modal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-sub" id="modal-body"></div>
      <button class="btn" id="modal-ok">確認</button>
      <button class="btn btn-ghost" id="modal-cancel" style="margin-top:10px">キャンセル</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
  // ── Themes ────────────────────────────────────────
  const THEMES = [
    {name:'パステル',  bg:'#0a0612',a1:'#a8d4ff',a2:'#5b8def',a3:'#7ef2c0',glow:'91,141,239'},
    {name:'オーシャン',bg:'#030d1a',a1:'#00b4d8',a2:'#90e0ef',a3:'#48cae4',glow:'0,180,216'},
    {name:'フォレスト',bg:'#071a07',a1:'#52b788',a2:'#95d5b2',a3:'#d8f3dc',glow:'82,183,136'},
    {name:'サンセット',bg:'#1a0805',a1:'#e63946',a2:'#ff8166',a3:'#ffd166',glow:'230,57,70'},
    {name:'ゴールド',  bg:'#100d00',a1:'#f9c74f',a2:'#f8961e',a3:'#f3722c',glow:'249,199,79'},

  function playChime() {
    try {
      const ctx=new AudioContext();
      [[523.25,0],[659.25,.18],[783.99,.36],[1046.5,.54]].forEach(([f,t])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(.2,ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.7);
        o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.75);
      });
    } catch(e){}
  }

  function getSlots(){
    const now=new Date();
    const sph=cfg?.slotsPerHour||10;
    const openH=cfg?.openHour??10;
    const closeH=cfg?.closeHour??16;
    const slots=[];
    // Try today, then tomorrow if no slots remain today
    for(let dayOffset=0;dayOffset<=1;dayOffset++){
      const base=new Date(now);
      base.setDate(base.getDate()+dayOffset);
      base.setMinutes(0,0,0);
      for(let h=openH;h<closeH;h++){
        const d=new Date(base);d.setHours(h);
        // Skip slots that are already over (allow up to end of hour)
        if(d.getTime()+3600000<=now.getTime())continue;
        const slotId=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(h)}`;
        const taken=reservations.filter(r=>r.slotId===slotId&&r.status!=='cancelled').length;
        slots.push({id:slotId,time:`${pad(h)}:00`,timeEnd:`${pad(h+1)}:00`,date:`${d.getMonth()+1}/${d.getDate()}`,available:Math.max(0,sph-taken),max:sph});
      }
      if(slots.length>0)break;
    }
    return slots;
  }

  async function updateCallCount(delta) {
    if(!cfg)return;
    const old=cfg.maxCallCount||30;

    if(next>old && cfg.autoCallEnabled!==false) {
      // staffTickets includes all statuses; falls back to tickets if staff listener not started
      const pool=staffTickets.length>0?staffTickets:tickets;
      const toCall=pool.filter(t=>t.status==='waiting'&&t.number>old&&t.number<=next);
      if(toCall.length>0){
        const batch=db.batch();
        toCall.forEach(t=>batch.update(db.collection('tickets').doc(t.id),{
          status:'called',calledAt:firebase.firestore.FieldValue.serverTimestamp()
        }));
        await batch.commit();
        toast(`${toCall.length}人を新たに呼び出しました`);

    }
    await cfgRef.update({maxCallCount:next});
  }

  function startExpireTimer(){
    if(!myTicket||myTicket.status!=='called'||!myTicket.calledAt)return;
    if(expireTimerId===myTicket.id)return;
    clearInterval(expireTimer);
    expireTimerId=myTicket.id;
    const expMs=(cfg?.expireMinutes||5)*60*1000;
    const calledMs=myTicket.calledAt.toDate?myTicket.calledAt.toDate().getTime():Date.now();
    expireTimer=setInterval(()=>{
      if(!myTicket||myTicket.status!=='called'){clearInterval(expireTimer);expireTimerId=null;return;}
      const rem=Math.max(0,expMs-(Date.now()-calledMs));
      const el=document.getElementById('expire-countdown');
      if(el)el.textContent=`${Math.floor(rem/60000)}:${String(Math.floor((rem%60000)/1000)).padStart(2,'0')}`;
      if(rem<=0){
        clearInterval(expireTimer);expireTimerId=null;
        if(myTicket)db.collection('tickets').doc(myTicket.id).update({status:'expired'});
        clearMyTicket();
        toast('有効時間を過ぎたため受付が終了しました。スタッフにお声がけください');
      }
    },1000);
  }

      reserveDraft.name=document.getElementById('inp-name')?.value??reserveDraft.name;
      reserveDraft.age=document.getElementById('inp-reserve-age')?.value??reserveDraft.age;
      reserveDraft.people=document.getElementById('inp-reserve-people')?.value??reserveDraft.people;
      reserveDraft.idType=document.getElementById('inp-idtype')?.value??reserveDraft.idType;
    }
    const root=document.getElementById('root');
    if(view==='display')     {root.innerHTML=renderDisplay();return;}
    if(view==='staff')       {root.innerHTML=renderStaff();}
    else if(view==='settings'){root.innerHTML=renderSettings();}
    else                     {root.innerHTML=renderCustomer();}
    postRender();
  }

  function postRender(){
    if(view==='customer')bindCustomer();
    else if(view==='staff')bindStaff();
    else if(view==='settings')bindSettings();
    if(view==='customer'&&myTicket?.status==='called')startExpireTimer();
  }

          <div style="text-align:center">
            <div class="ctrl-num">${maxCall}</div>
            <div class="ctrl-unit">人まで呼び出し中</div>
          </div>
          <button class="ctrl-btn" id="btn-plus">＋</button>
        </div>
        <div style="font-size:12px;color:var(--muted);text-align:center;margin-top:4px">No.01 〜 No.${pad(maxCall)} が対象</div>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num" style="color:var(--accent2)">${calling.length}</div><div class="stat-label">呼出中</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--warning)">${waiting.length}</div><div class="stat-label">待機中</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--accent3)">${(cfg.nextNumber||1)-1}</div><div class="stat-label">発行済</div></div>
      </div>
      <div class="card">
        <div class="sec">整理券一覧 (発行済: ${staffTickets.length}枚)</div>
        <div class="queue-scroll" style="max-height:320px">
          ${staffTickets.length===0?'<div class="empty-msg">まだ整理券は発行されていません</div>':
            staffTickets.map(t=>{
              const badgeLabel=t.status==='waiting'?'待機中':t.status==='called'?'呼出中':t.status==='done'?'使用済み':t.status==='expired'?'有効切れ':'キャンセル';
              return `<div class="stk-row">
                <div class="stk-num">No.${pad(t.number)}</div>
                <div class="stk-info">
                  <div class="stk-name">${t.nickname||'--'} <span style="font-weight:400;font-size:11px;color:var(--muted)">${t.people||1}名 · ${t.age||'--'}歳</span></div>
                  <div class="stk-meta">${formatDate(t.createdAt)||''}</div>
                </div>
                <span class="stk-badge ${t.status}">${badgeLabel}</span>
                <div style="display:flex;flex-direction:column;gap:4px;margin-left:4px">
                  ${(t.status==='waiting'||t.status==='expired')?`<button class="btn-icon" onclick="callTicketById('${t.id}')" style="font-size:10px;padding:4px 7px;color:var(--accent2);border-color:rgba(var(--glow),.3)">呼出</button>`:''}
                  ${(t.status==='called'||t.status==='expired')?`<button class="btn-icon" onclick="doneTicketById('${t.id}')" style="font-size:10px;padding:4px 7px;color:var(--accent3);border-color:rgba(85,239,196,.3)">完了</button>`:''}
                  ${(t.status==='waiting'||t.status==='called'||t.status==='expired')?`<button class="btn-icon" onclick="cancelTicketById('${t.id}')" style="font-size:10px;padding:4px 7px;color:var(--danger);border-color:rgba(148,158,196,.3)">取消</button>`:''}
                </div>
              </div>`;
            }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="sec">操作</div>
        <button class="btn btn-ghost" id="btn-toggle" style="margin-bottom:10px">${cfg.isOpen?'受付を停止する':'受付を再開する'}</button>
        <button class="btn" id="btn-reset" style="background:rgba(148,158,196,.08);color:var(--danger);border:1px solid rgba(148,158,196,.2)">全データをリセット</button>
      </div>
      ${cfg.reservationEnabled?`<div class="card">
        <div class="sec">予約リスト (${reservations.length}件)</div>
        ${reservations.length===0?'<div class="empty-msg">予約はありません</div>':
          Object.entries(reservations.reduce((acc,r)=>{if(!acc[r.slotId])acc[r.slotId]=[];acc[r.slotId].push(r);return acc;},{}))
            .map(([slotId,slotResv])=>`
              <div class="resv-slot-label">${slotResv[0].slotDate} ${slotResv[0].slotTime} の枠 (${slotResv.length}件)</div>
              ${slotResv.map(r=>`<div class="resv-card">
                <div class="resv-info">
                  <div class="resv-name">${r.name} <span style="font-weight:400;font-size:12px;color:var(--muted)">${r.people}名</span></div>
                  <div class="resv-meta">${r.idType} · ${r.age}歳 · ${r.status==='arrived'?'✓ 来場済み':'予約済み'}</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:5px">
                  ${r.status==='reserved'?`<button class="btn-icon" onclick="markArrived('${r.id}')" style="font-size:11px;padding:5px 8px;color:#34d399;border-color:rgba(52,211,153,.3)">来場✓</button>`:''}
                  <button class="btn-icon" onclick="cancelReservationById('${r.id}')" style="font-size:11px;padding:5px 8px;color:var(--danger);border-color:rgba(148,158,196,.3)">取消</button>
                </div>
              </div>`).join('')}
            `).join('')}
      </div>`:''}
      <div class="center" style="margin-top:10px"><a class="link" href="?mode=display" target="_blank">📺 表示ボードを別タブで開く</a></div>
      <div class="center" style="margin-top:10px"><button onclick="staffLogout()" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px">スタッフ画面を終了</button></div>
    </div>`;
  }

  // ── renderSettings ────────────────────────────────
  function renderSettings(){
    return `<div class="page">
      <div class="header"><div class="badge">SETTINGS</div><h1>設定</h1></div>
      <form id="settings-form">
        <div class="card">
          <div class="sec">店舗情報</div>
          <div class="field"><label class="field-label">店名</label><input class="field-input" name="storeName" value="${cfg.storeName||''}" placeholder="例: Bon Voyage"></div>
          <div class="field"><label class="field-label">スローガン</label><input class="field-input" name="slogan" value="${cfg.slogan||''}" placeholder="例: 旅へ出よう"></div>
          <div class="field"><label class="field-label">売り場の場所</label><input class="field-input" name="location" value="${cfg.location||''}" placeholder="例: 中庭、A棟前など"></div>
          <div class="field"><label class="field-label">呼び出し人数（初期値）</label><input class="field-input" name="maxCallCount" type="number" min="1" max="999" value="${cfg.maxCallCount||30}"></div>
          <div class="field" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0">
            <div>
              <label class="field-label" style="margin-bottom:0;font-size:14px;color:var(--text)">自動呼び出しを有効にする</label>
              <div style="font-size:11px;color:var(--muted);margin-top:3px">オフにすると手動で「呼出」ボタンを押すまで呼び出されません</div>
            </div>
            <input type="checkbox" id="inp-autocall-enabled" ${cfg.autoCallEnabled!==false?'checked':''} style="width:22px;height:22px;cursor:pointer;accent-color:var(--accent);flex-shrink:0">
          </div>
          <div class="field"><label class="field-label">スタッフ承認コード</label><input class="field-input" name="stampPassword" type="text" autocapitalize="off" autocorrect="off" placeholder="変更する場合のみ入力" autocomplete="off"><div style="font-size:11px;color:var(--muted);margin-top:4px">セキュリティのため現在のコードは表示されません。空欄のまま保存すると変更されません</div></div>
          <div class="field"><label class="field-label">呼び出し後の有効時間（分）</label><input class="field-input" name="expireMinutes" type="number" min="1" max="60" step="1" value="${cfg.expireMinutes||5}"><div style="font-size:11px;color:var(--muted);margin-top:4px">この時間を過ぎると自動キャンセルされます</div></div>
          <div class="field"><label class="field-label">1人あたりの目安時間（分）</label><input class="field-input" name="minutesPerPerson" type="number" min="0.5" max="30" step="0.5" value="${cfg.minutesPerPerson||3}"><div style="font-size:11px;color:var(--muted);margin-top:4px">待ち時間の予定呼び出し時刻の計算に使います</div></div>
        </div>
        <div class="card">
          <div class="sec">予約システム</div>
          <div class="field" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
            <div>
              <label class="field-label" style="margin-bottom:0;font-size:14px;color:var(--text)">予約を受け付ける</label>
              <div style="font-size:11px;color:var(--muted);margin-top:3px">ホーム画面に「予約する」ボタンを表示</div>
            </div>
            <input type="checkbox" name="reservationEnabled" id="inp-resv-enabled" ${cfg.reservationEnabled?'checked':''} style="width:22px;height:22px;cursor:pointer;accent-color:var(--accent);flex-shrink:0">
          </div>
          <div class="field"><label class="field-label">受付開始時間（時）</label>
            <input class="field-input" name="openHour" type="number" min="0" max="23" value="${cfg.openHour??10}" inputmode="numeric">
            <div style="font-size:11px;color:var(--muted);margin-top:4px">例: 10 → 10:00から受付開始</div>
          </div>
          <div class="field"><label class="field-label">受付終了時間（時）</label>
            <input class="field-input" name="closeHour" type="number" min="1" max="24" value="${cfg.closeHour??16}" inputmode="numeric">
            <div style="font-size:11px;color:var(--muted);margin-top:4px">例: 16 → 15:00〜16:00の枠が最後</div>
          </div>
          <div class="field" style="margin-bottom:0"><label class="field-label">1時間あたりの予約枠数</label>
            <input class="field-input" name="slotsPerHour" type="number" min="1" max="100" value="${cfg.slotsPerHour||10}">
            <div style="font-size:11px;color:var(--muted);margin-top:4px">1時間あたりの最大予約受付人数</div>
          </div>
        </div>
        <div class="card">
          <div class="sec">テーマ（背景・カラー）</div>
          <div class="theme-grid">
            ${THEMES.map((t,i)=>`<label class="theme-swatch ${(cfg.theme||0)===i?'selected':''}">
              <input type="radio" name="theme" value="${i}" ${(cfg.theme||0)===i?'checked':''} style="display:none">
              <div class="theme-preview" style="background:${t.bg};border-color:${t.a1}">
                <div class="theme-dot" style="background:${t.a1}"></div>
                <div class="theme-dot" style="background:${t.a2}"></div>
                <div class="theme-dot" style="background:${t.a3}"></div>
              </div>
              <div class="theme-name">${t.name}</div>
            </label>`).join('')}
          </div>
        </div>
        <button type="submit" class="btn btn-primary">保存する</button>
      </form>
      <div class="center" style="margin-top:12px">
        <button onclick="view='staff';render()" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px">← 管理画面に戻る</button>
      </div>
    </div>`;
  }

// ── renderDisplay ─────────────────────────────────
  function renderDisplay(){
    const maxCall=cfg?.maxCallCount||30;
    const waitCount=tickets.filter(t=>t.status==='waiting').length;
    return `<div class="display-root">
      <div class="display-top">${cfg?.storeName||'BON VOYAGE'} — ${cfg?.location||'文化祭'}</div>
      ${cfg?.slogan?`<div class="display-slogan" style="margin-top:60px">${cfg.slogan}</div>`:'<div style="height:60px"></div>'}
      <div class="display-label">現在 呼び出し中</div>
      <div class="display-range ${!cfg?.isOpen?'empty':''}">No.01 〜 No.${pad(maxCall)}</div>
      <div class="display-caption">${cfg?.isOpen?'該当番号の方はカウンターへ':'現在受付停止中'}</div>
      <div class="display-wait-label">WAITING</div>
      <div class="display-wait-num">${waitCount}</div>
      <div class="display-wait-unit">人待機中</div>
    </div>`;
  }

  // ── Event binding ─────────────────────────────────
  function bindCustomer(){
    // Sub-view navigation
    document.getElementById('btn-to-walkin')?.addEventListener('click',()=>{customerSubView='walkinForm';render();});
    document.getElementById('btn-to-reserve')?.addEventListener('click',()=>{customerSubView='reserveSlots';render();});
    document.getElementById('btn-to-reserve-form')?.addEventListener('click',()=>{customerSubView='reserveForm';render();});
    document.getElementById('btn-back-home')?.addEventListener('click',()=>{customerSubView='home';render();});
    document.getElementById('btn-back-slots')?.addEventListener('click',()=>{customerSubView='reserveSlots';render();});
    // Walk-in form submit → in-app confirmation
    document.getElementById('btn-submit-walkin')?.addEventListener('click',()=>{
      const fd={
        nickname:(document.getElementById('inp-nickname')?.value||'').trim(),
        age:document.getElementById('inp-age')?.value||'',
        people:document.getElementById('inp-people')?.value||'1'
      };
      if(!fd.nickname){toast('ニックネームを入力してください');return;}
      if(!fd.age){toast('年齢を入力してください');return;}
      showConfirm(
        '整理券を取得しますか？',
        `<div style="background:rgba(255,255,255,.04);border-radius:12px;padding:12px 14px;margin-bottom:10px">
          <div style="font-size:15px;font-weight:700;margin-bottom:4px">${fd.nickname}</div>
          <div style="font-size:13px;color:var(--muted)">${fd.age}歳 · ${fd.people}名</div>
        </div>
        <div style="font-size:12px;color:var(--warning);background:rgba(253,203,110,.08);border:1px solid rgba(253,203,110,.15);border-radius:8px;padding:8px 10px;margin-bottom:10px">⚠ 呼び出しから<strong>${cfg.expireMinutes||5}分</strong>以内にお越しください。過ぎると有効期限切れになります</div>
        <div style="font-size:12px;color:var(--muted)">取得後もキャンセルできます</div>`,
        '取得する',
        ()=>getTicketWithForm(fd),
        false,
        'btn-rainbow'
      );
    });
    // Reserve form submit → in-app confirmation
    document.getElementById('btn-submit-reserve')?.addEventListener('click',()=>{
      const fd={
        name:(document.getElementById('inp-name')?.value||'').trim(),
        age:document.getElementById('inp-reserve-age')?.value||'',
        people:document.getElementById('inp-reserve-people')?.value||'1',
        idType:document.getElementById('inp-idtype')?.value||''
      };
      if(!fd.name){toast('氏名を入力してください');return;}
      if(!fd.age){toast('年齢を入力してください');return;}
      if(!fd.idType){toast('持参する身分証を選択してください');return;}
      const timeEnd=selectedSlot?pad(parseInt(selectedSlot.time.split(':')[0])+1)+':00':'';
      showConfirm(
        '予約を確定しますか？',
        `<div style="background:rgba(255,255,255,.04);border-radius:12px;padding:12px 14px;margin-bottom:10px">
          <div style="font-size:12px;color:var(--accent);font-weight:700;margin-bottom:6px">${selectedSlot?.date} ${selectedSlot?.time} 〜 ${timeEnd}</div>
          <div style="font-size:15px;font-weight:700;margin-bottom:4px">${fd.name}</div>
          <div style="font-size:13px;color:var(--muted)">${fd.age}歳 · ${fd.people}名 · ${fd.idType}</div>
        </div>
        <div style="font-size:12px;color:var(--warning)">⚠ 来場時に身分証の提示が必要です</div>`,
        '予約を確定する',
        ()=>makeReservation(fd)
      );
    });
    // Ticket actions
    document.getElementById('btn-cancel')?.addEventListener('click',cancelTicket);
    document.getElementById('btn-new')?.addEventListener('click',()=>clearMyTicket());
    document.getElementById('btn-use')?.addEventListener('click',showUseModal);
    document.getElementById('btn-stamp')?.addEventListener('click',submitStamp);
    document.getElementById('btn-hide-modal')?.addEventListener('click',hideUseModal);
    document.getElementById('stamp-code')?.addEventListener('keydown',e=>{if(e.key==='Enter')submitStamp();});
    document.getElementById('use-modal')?.addEventListener('click',e=>{if(e.target===e.currentTarget)hideUseModal();});
    // Reservation actions
    document.getElementById('btn-cancel-resv')?.addEventListener('click',cancelReservation);
    document.getElementById('btn-new-resv')?.addEventListener('click',()=>clearMyReservation());
  }
  function bindStaff(){
    document.getElementById('btn-minus')?.addEventListener('click',()=>updateCallCount(-1));
    document.getElementById('btn-plus')?.addEventListener('click',()=>updateCallCount(1));
    document.getElementById('btn-toggle')?.addEventListener('click',toggleOpen);
    document.getElementById('btn-reset')?.addEventListener('click',resetAll);
  }
  function bindSettings(){
    document.getElementById('settings-form')?.addEventListener('submit',e=>{e.preventDefault();saveSettings(e.target);});
    document.querySelectorAll('input[name="theme"]').forEach(inp=>{
      inp.addEventListener('change',()=>{
        applyTheme(parseInt(inp.value));
        document.querySelectorAll('.theme-swatch').forEach(s=>s.classList.remove('selected'));
        inp.closest('.theme-swatch')?.classList.add('selected');
      });
    });
  }
// ── Start ─────────────────────────────────────────
  document.getElementById('modal-ok').addEventListener('click',()=>{const cb=modalCallback;hideConfirm();cb?.();});
  document.getElementById('modal-cancel').addEventListener('click',hideConfirm);
  document.getElementById('generic-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)hideConfirm();});
  startListeners();
  </script>
</body>
</html>
